examples:
  - prompt: "Help me deploy the Datadog Forwarder to AWS"
    response: |
      I'll help you deploy the Datadog Forwarder to AWS using CloudFormation, which is the recommended method. Let me guide you through this step-by-step.
      
      ## Pre-Deployment Checklist
      
      Before we begin, please confirm you have:
      - [ ] Your Datadog API key (get it from https://app.datadoghq.com/account/settings#api)
      - [ ] Your Datadog site (datadoghq.com, datadoghq.eu, etc.)
      - [ ] AWS console access with CloudFormation permissions
      - [ ] Understanding of which AWS region(s) you need to deploy to
      
      ## Step-by-Step Deployment
      
      ### Step 1: Prepare Your API Key
      
      You have three options for storing your API key securely:
      
      **Option A: Use CloudFormation parameter (quickest for testing)**
      - You'll enter the API key during stack creation
      - It will be stored in AWS Secrets Manager automatically
      
      **Option B: Pre-create in Secrets Manager (recommended for production)**
      ```bash
      aws secretsmanager create-secret \
        --name DatadogAPIKey \
        --secret-string "your-api-key-here" \
        --region us-east-1
      ```
      Note the ARN returned - you'll need it.
      
      **Option C: Use SSM Parameter Store**
      ```bash
      aws ssm put-parameter \
        --name /datadog/api_key \
        --value "your-api-key-here" \
        --type SecureString \
        --region us-east-1
      ```
      
      ### Step 2: Deploy the CloudFormation Stack
      
      1. Open the AWS CloudFormation Console in your target region
      2. Click "Create stack" → "With new resources"
      3. Choose "Amazon S3 URL" and enter:
         ```
         https://datadog-cloudformation-template.s3.amazonaws.com/aws/forwarder/latest.yaml
         ```
      4. Click "Next"
      
      ### Step 3: Configure Stack Parameters
      
      **Required Parameters:**
      - Stack name: `datadog-forwarder`
      - DdSite: `datadoghq.com` (or your specific site)
      - DdApiKey: Your API key (if using Option A)
      - OR DdApiKeySecretArn: The ARN from Option B
      - OR DdApiKeySsmParameterName: `/datadog/api_key` (if using Option C)
      
      **Recommended Parameters:**
      - ReservedConcurrency: `10` (prevents throttling other functions)
      - MemorySize: `1024` (good balance of cost/performance)
      - Timeout: `120` (handles most log volumes)
      - DdTags: `env:production,service:log-forwarder,team:platform`
      
      5. Click "Next" through the options page
      6. On the Review page, check "I acknowledge that AWS CloudFormation might create IAM resources"
      7. Click "Create stack"
      
      ### Step 4: Wait for Deployment
      
      The stack creation takes 2-3 minutes. Monitor the Events tab for progress.
      
      ### Step 5: Verify Deployment
      
      Once the stack shows "CREATE_COMPLETE":
      
      1. Go to the Resources tab
      2. Find the resource with Logical ID "Forwarder"
      3. Click the Physical ID to open the Lambda function
      4. Verify the function configuration shows ARM64 architecture
      
      ### Step 6: Test the Function
      
      ```bash
      aws lambda invoke \
        --function-name DatadogForwarder \
        --payload '{"test": "event"}' \
        --region us-east-1 \
        response.json
      
      cat response.json
      ```
      
      ### Step 7: Set Up Log Sources
      
      Now configure triggers for your log sources:
      
      **For CloudWatch Log Groups:**
      ```bash
      aws logs put-subscription-filter \
        --log-group-name "/aws/lambda/my-function" \
        --filter-name "datadog-forwarder" \
        --filter-pattern "" \
        --destination-arn "arn:aws:lambda:us-east-1:ACCOUNT:function:DatadogForwarder"
      ```
      
      **For S3 Buckets:**
      1. Go to S3 bucket → Properties → Event notifications
      2. Create notification for "All object create events"
      3. Destination: Lambda function → DatadogForwarder
      
      ### Step 8: Verify Logs in Datadog
      
      1. Go to https://app.datadoghq.com/logs/livetail
      2. Filter by `source:aws` or your specific source
      3. You should see logs flowing within 1-2 minutes
      
      ## Next Steps
      
      - Set up monitors for the Forwarder function errors
      - Review the logs to ensure proper formatting
      - Configure additional log sources as needed
      - Consider deploying to additional regions if needed
      
      Would you like help with any specific step or have questions about the deployment?
  
  - prompt: "Explain how the AWS logs monitoring code works"
    response: |
      Let me explain in detail what the AWS logs monitoring (Datadog Forwarder) codebase does and how it works.
      
      ## What This Code Actually Does
      
      The Datadog Forwarder is an **intelligent data pipeline** that sits between your AWS infrastructure and Datadog. Think of it as a sophisticated mail sorting facility:
      
      - **Receives**: Log data from various AWS sources in different formats
      - **Processes**: Unwraps, enriches, and transforms the data
      - **Delivers**: Sends organized, tagged data to Datadog for monitoring
      
      **Real-World Example:**
      When your Lambda function logs "User 123 logged in", this code:
      1. Receives the log from CloudWatch
      2. Unwraps it from AWS's gzip/base64 encoding
      3. Adds context: "This came from my-api-function in production, us-east-1"
      4. Groups it with other recent logs into a batch
      5. Sends it to Datadog where you can search, alert, and analyze it
      
      ## The 4-Stage Pipeline Architecture
      
      Location: `aws/logs_monitoring/lambda_function.py` (main entry point)
      
      ```python
      def datadog_forwarder(event, context):
          # Stage 1: Parse - Extract logs from AWS format
          parsed = parse(event, context, cache_layer)
          
          # Stage 2: Enrich - Add metadata and tags
          enriched = enrich(parsed, cache_layer)
          
          # Stage 3: Transform - Flatten complex structures
          transformed = transform(enriched)
          
          # Stage 4: Split - Separate logs/metrics/traces
          metrics, logs, trace_payloads = split(transformed)
          
          # Finally: Send to Datadog
          forwarder.forward(logs, metrics, trace_payloads)
      ```
      
      Let me explain each stage in detail:
      
      ### Stage 1: PARSE (`steps/parsing.py`)
      
      **What it does:** Identifies where the log came from and extracts the actual log data
      
      **The Challenge:** AWS services send logs in different wrapper formats:
      - CloudWatch: gzip-compressed, base64-encoded JSON
      - S3: Files in various formats (CloudTrail, VPC Flow, ALB logs)
      - SNS: JSON messages that might contain nested S3 events
      - Kinesis: Streaming records with embedded CloudWatch data
      
      **How it works:**
      ```python
      def parse(event, context, cache_layer):
          # First, figure out what type of event this is
          event_type = parse_event_type(event)
          
          # Route to the right handler
          match event_type:
              case AwsEventType.AWSLOGS:
                  # CloudWatch logs handler
                  aws_handler = AwsLogsHandler(context, cache_layer)
                  events = aws_handler.handle(event)
              case AwsEventType.S3:
                  # S3 logs handler  
                  s3_handler = S3EventHandler(context, metadata, cache_layer)
                  events = s3_handler.handle(event)
              # ... other handlers
      ```
      
      **Real Example - CloudWatch Log:**
      ```
      Input: {awslogs: {data: "H4sIAA...base64..."}}  ← Compressed, encoded
      Handler: Decodes base64 → Decompresses gzip → Parses JSON
      Output: [{message: "User 123 logged in", timestamp: 1234567890}]
      ```
      
      **Real Example - S3 CloudTrail Log:**
      ```
      Input: {Records: [{s3: {bucket: "logs", key: "cloudtrail/2024/..."}}]}
      Handler: Downloads file from S3 → Detects CloudTrail format → Parses events
      Output: [{eventName: "AssumeRole", userIdentity: {...}, ...}]
      ```
      
      ### Stage 2: ENRICH (`steps/enrichment.py`)
      
      **What it does:** Adds critical metadata that makes logs useful for filtering and correlation
      
      **The Challenge:** Raw logs lack context like "which Lambda function?" or "what environment?"
      
      **How it works:**
      ```python
      def enrich(events, cache_layer):
          for event in events:
              # For Lambda logs, add function metadata
              add_metadata_to_lambda_log(event, cache_layer)
              
              # Extract tags from the log message itself
              extract_ddtags_from_message(event)
              
              # For CloudTrail, identify the EC2 host
              extract_host_from_cloudtrails(event)
      ```
      
      **Real Example - Lambda Log Enrichment:**
      ```
      Input event:
      {
          "message": "User 123 logged in",
          "lambda": {"arn": "arn:aws:lambda:us-east-1:123456:function:my-api"}
      }
      
      Enrichment process:
      1. Extract function name from ARN: "my-api"
      2. Set host to Lambda ARN
      3. Add tags: ["functionname:my-api"]
      4. Fetch custom tags from Lambda (cached): ["env:prod", "team:backend"]
      5. Set service: "my-api" (or from custom tags if exists)
      
      Output event:
      {
          "message": "User 123 logged in",
          "host": "arn:aws:lambda:us-east-1:123456:function:my-api",
          "service": "my-api",
          "ddtags": "functionname:my-api,env:prod,team:backend"
      }
      ```
      
      **Why This Matters:**
      Now in Datadog you can filter: `service:my-api env:prod` to see only production logs from this function.
      
      ### Stage 3: TRANSFORM (`steps/transformation.py`)
      
      **What it does:** Restructures complex log formats so they're queryable in Datadog
      
      **The Challenge:** Some AWS logs have nested arrays of objects, which Datadog can't easily search
      
      **How it works:**
      ```python
      def transform(events):
          # Handle AWS WAF logs (nested array of rules)
          for index, event in enumerate(events):
              waf = parse_aws_waf_logs(event)
              if waf != event:
                  events[index] = waf
          
          # Separate Security Hub findings into individual events
          for event in reversed(events):
              findings = separate_security_hub_findings(event)
              if findings:
                  events.remove(event)
                  events.extend(findings)  # One finding = one event
      ```
      
      **Real Example - Security Hub:**
      ```
      Input: One event with array of 5 security findings
      {
          "detail": {
              "findings": [
                  {"title": "S3 bucket public", "severity": "HIGH"},
                  {"title": "Unused IAM role", "severity": "LOW"},
                  {"title": "SSH port open", "severity": "CRITICAL"},
                  ...
              ]
          }
      }
      
      Transform: Split into 5 separate events
      [{detail: {finding: {title: "S3 bucket public", ...}}},
       {detail: {finding: {title: "Unused IAM role", ...}}},
       {detail: {finding: {title: "SSH port open", ...}}},
       ...]
      
      Why: Now you can search "severity:CRITICAL" and get only critical findings
      ```
      
      ### Stage 4: SPLIT (`steps/splitting.py`)
      
      **What it does:** Separates metrics, traces, and logs into different buckets
      
      **The Challenge:** Datadog has different APIs for logs, metrics, and traces
      
      **How it works:**
      ```python
      def split(events):
          metrics, logs, trace_payloads = [], [], []
          
          for event in events:
              # Check if it's a custom metric
              metric = extract_metric(event)
              
              # Check if it's a trace payload
              trace_payload = extract_trace_payload(event)
              
              if metric:
                  metrics.append(metric)
              elif trace_payload:
                  trace_payloads.append(trace_payload)
              else:
                  logs.append(event)  # Everything else is a log
      ```
      
      **Real Examples:**
      
      **Metric Detection:**
      ```python
      # If log message looks like: {"m": "request.count", "v": 42, "e": 1234567890, "t": ["env:prod"]}
      # It's a custom metric, not a log
      
      Input: {message: '{"m": "request.count", "v": 42, "e": 1234567890, "t": ["env:prod"]}'}
      Check: Has required fields (m=name, v=value, e=timestamp, t=tags)?
      Result: Extract as METRIC, send to metrics API
      ```
      
      **Trace Detection:**
      ```python
      # If log message has "traces" array with trace_id, it's APM data
      
      Input: {message: '{"traces": [[{"trace_id": 123, "span_id": 456, ...}]]}'}
      Check: Has "traces" array? Has trace_id in spans?
      Result: Extract as TRACE, send to traces API
      ```
      
      **Everything Else:**
      ```python
      Input: {message: "User 123 logged in"}
      Check: Not a metric format, not a trace format
      Result: Keep as LOG, send to logs API
      ```
      
      ### Stage 5: FORWARD (`forwarder.py`)
      
      **What it does:** Actually sends the data to Datadog efficiently
      
      **Key Features:**
      
      1. **Batching:**
         ```python
         # Instead of 1000 HTTP requests for 1000 logs:
         # Group into batches (max 5MB or 1000 logs each)
         # Send maybe 2-3 requests instead
         
         batch_1 = logs[0:1000]   # First 1000 logs
         batch_2 = logs[1000:2000] # Next 1000 logs
         send_to_datadog(batch_1)
         send_to_datadog(batch_2)
         ```
      
      2. **Compression:**
         ```python
         # Compress with gzip before sending
         # 100 KB of logs → 10 KB compressed
         # Saves bandwidth and money
         ```
      
      3. **Retry Logic:**
         ```python
         # If send fails, retry with exponential backoff
         try:
             send_to_datadog(logs)
         except NetworkError:
             wait(1 second)
             retry()  # If fails again, wait 2s, then 4s, then 8s...
         ```
      
      4. **Failed Event Storage:**
         ```python
         # If DD_STORE_FAILED_EVENTS is enabled:
         # Save failed logs to S3 for later replay
         # Prevents data loss during outages
         ```
      
      ## Supporting Components
      
      ### Scrubber (`logs/datadog_scrubber.py`)
      **What it does:** Redacts sensitive data from logs
      
      ```python
      Input: "Customer card 4532-1234-5678-9010 was charged"
      Scrubber: Detects credit card pattern
      Output: "Customer card ***REDACTED*** was charged"
