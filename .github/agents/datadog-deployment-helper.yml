      ## Complete Example: CloudWatch Log Journey
      
      ```
      1. Your Lambda logs: logger.info("Payment processed: $50")
      
      2. CloudWatch receives it, wraps it:
         {awslogs: {data: "H4sIAA...compressed+encoded..."}}
      
      3. CloudWatch triggers Datadog Forwarder Lambda
      
      4. PARSE stage:
         - Detects: CloudWatch event
         - Decodes base64 → Decompresses gzip
         - Extracts: {message: "Payment processed: $50", timestamp: 1234567890}
      
      5. ENRICH stage:
         - Adds function ARN as host
         - Adds tags: functionname:payment-service, env:prod, team:payments
         - Sets service: payment-service
      
      6. TRANSFORM stage:
         - No complex structures to flatten
         - Passes through unchanged
      
      7. SPLIT stage:
         - Not a metric (no {m, v, e, t} format)
         - Not a trace (no "traces" array)
         - Classified as: LOG
      
      8. FORWARD stage:
         - Groups with 999 other recent logs
         - Compresses batch with gzip
         - Sends to: https://http-intake.logs.datadoghq.com/v1/input
         - Receives: 200 OK
      
      9. Appears in Datadog Live Tail within 2 seconds!
      
      10. You can now search in Datadog:
          - service:payment-service env:prod "Payment processed"
          - Set up alert: if count > 1000 in 5 mins, page on-call
      ```
      
