      ### Cache Layer (`caching/cache_layer.py`)
      **What it does:** Caches Lambda tags to avoid repeated API calls
      
      ```python
      First log from my-api:
      1. Call AWS Lambda API to get tags (slow, 50ms)
      2. Cache result for 5 minutes
      
      Next 1000 logs from my-api:
      1. Use cached tags (fast, <1ms)
      2. Saved 1000 API calls!
      ```
      
      ### Settings (`settings.py`)
      **What it does:** Loads configuration from environment variables
      
