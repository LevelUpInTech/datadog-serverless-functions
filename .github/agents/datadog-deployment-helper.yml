examples:
  - prompt: "Help me deploy the Datadog Forwarder to AWS"
    response: |
      I'll help you deploy the Datadog Forwarder to AWS using CloudFormation, which is the recommended method. Let me guide you through this step-by-step.
      
      ## Pre-Deployment Checklist
      
      Before we begin, please confirm you have:
      - [ ] Your Datadog API key (get it from https://app.datadoghq.com/account/settings#api)
      - [ ] Your Datadog site (datadoghq.com, datadoghq.eu, etc.)
      - [ ] AWS console access with CloudFormation permissions
      - [ ] Understanding of which AWS region(s) you need to deploy to
      
      ## Step-by-Step Deployment
      
      ### Step 1: Prepare Your API Key
      
      You have three options for storing your API key securely:
      
      **Option A: Use CloudFormation parameter (quickest for testing)**
      - You'll enter the API key during stack creation
      - It will be stored in AWS Secrets Manager automatically
      
      **Option B: Pre-create in Secrets Manager (recommended for production)**
      ```bash
      aws secretsmanager create-secret \
        --name DatadogAPIKey \
        --secret-string "your-api-key-here" \
        --region us-east-1
      ```
      Note the ARN returned - you'll need it.
      
      **Option C: Use SSM Parameter Store**
      ```bash
      aws ssm put-parameter \
        --name /datadog/api_key \
        --value "your-api-key-here" \
        --type SecureString \
        --region us-east-1
      ```
      
      ### Step 2: Deploy the CloudFormation Stack
      
      1. Open the AWS CloudFormation Console in your target region
      2. Click "Create stack" → "With new resources"
      3. Choose "Amazon S3 URL" and enter:
         ```
         https://datadog-cloudformation-template.s3.amazonaws.com/aws/forwarder/latest.yaml
         ```
      4. Click "Next"
      
      ### Step 3: Configure Stack Parameters
      
      **Required Parameters:**
      - Stack name: `datadog-forwarder`
      - DdSite: `datadoghq.com` (or your specific site)
      - DdApiKey: Your API key (if using Option A)
      - OR DdApiKeySecretArn: The ARN from Option B
      - OR DdApiKeySsmParameterName: `/datadog/api_key` (if using Option C)
      
      **Recommended Parameters:**
      - ReservedConcurrency: `10` (prevents throttling other functions)
      - MemorySize: `1024` (good balance of cost/performance)
      - Timeout: `120` (handles most log volumes)
      - DdTags: `env:production,service:log-forwarder,team:platform`
      
      5. Click "Next" through the options page
      6. On the Review page, check "I acknowledge that AWS CloudFormation might create IAM resources"
      7. Click "Create stack"
      
      ### Step 4: Wait for Deployment
      
      The stack creation takes 2-3 minutes. Monitor the Events tab for progress.
      
      ### Step 5: Verify Deployment
      
      Once the stack shows "CREATE_COMPLETE":
      
      1. Go to the Resources tab
      2. Find the resource with Logical ID "Forwarder"
      3. Click the Physical ID to open the Lambda function
      4. Verify the function configuration shows ARM64 architecture
      
      ### Step 6: Test the Function
      
      ```bash
      aws lambda invoke \
        --function-name DatadogForwarder \
        --payload '{"test": "event"}' \
        --region us-east-1 \
        response.json
      
      cat response.json
      ```
      
      ### Step 7: Set Up Log Sources
      
      Now configure triggers for your log sources:
      
      **For CloudWatch Log Groups:**
      ```bash
      aws logs put-subscription-filter \
        --log-group-name "/aws/lambda/my-function" \
        --filter-name "datadog-forwarder" \
        --filter-pattern "" \
        --destination-arn "arn:aws:lambda:us-east-1:ACCOUNT:function:DatadogForwarder"
      ```
      
      **For S3 Buckets:**
      1. Go to S3 bucket → Properties → Event notifications
      2. Create notification for "All object create events"
      3. Destination: Lambda function → DatadogForwarder
      
      ### Step 8: Verify Logs in Datadog
      
      1. Go to https://app.datadoghq.com/logs/livetail
      2. Filter by `source:aws` or your specific source
      3. You should see logs flowing within 1-2 minutes
      
      ## Next Steps
      
      - Set up monitors for the Forwarder function errors
      - Review the logs to ensure proper formatting
      - Configure additional log sources as needed
      - Consider deploying to additional regions if needed
      
      Would you like help with any specific step or have questions about the deployment?
  
  - prompt: "Explain how the AWS logs monitoring code works"
    response: |
      Let me explain the architecture and flow of the AWS logs monitoring (Datadog Forwarder) codebase.
      
      ## Architecture Overview
      
      The Datadog Forwarder is a Lambda function that processes various AWS log sources and forwards them to Datadog. Here's how the code is structured:
      
      ### Entry Point: lambda_function.py
      
      Location: `aws/logs_monitoring/lambda_function.py`
      
      This is the main handler that Lambda invokes. It:
      1. Receives events from various AWS sources (CloudWatch, S3, SNS, Kinesis)
      2. Detects the event type
      3. Routes to appropriate handlers
      4. Returns success/failure response
      
      Key function:
      ```python
      def lambda_handler(event, context):
          # Determines event source and routes accordingly
          if is_cloudwatch_event(event):
              return handle_cloudwatch_logs(event)
          elif is_s3_event(event):
              return handle_s3_event(event)
          # etc.
      ```
      
      ### Core Modules
      
      #### 1. datadog_client.py (`logs/datadog_client.py`)
      
      Handles HTTP communication with Datadog:
      - Manages API endpoint URLs based on DD_SITE
      - Constructs HTTP requests with proper headers
      - Implements retry logic for failures
      - Handles compression (gzip) for large payloads
      
      #### 2. datadog_batcher.py (`logs/datadog_batcher.py`)
      
      Optimizes log transmission:
      - Groups logs into batches (max 5 MB per batch)
      - Reduces API calls for efficiency
      - Handles batch size limits
      - Preserves log ordering within batches
      
      #### 3. datadog_scrubber.py (`logs/datadog_scrubber.py`)
      
      Security and compliance:
      - Redacts sensitive data (credit cards, SSNs, etc.)
      - Uses regex patterns for detection
      - Configurable scrubbing rules
      - Prevents accidental leakage of secrets
      
      #### 4. helpers.py (`logs/helpers.py`)
      
      Utility functions for:
      - Parsing CloudWatch log format
      - Extracting metadata from events
      - Tag generation and enrichment
      - Log transformation and normalization
      
      ### Processing Flow
      
      ```
      1. Lambda receives event
         ↓
      2. lambda_handler() identifies source type
         ↓
      3. Source-specific handler extracts logs
         ↓
      4. helpers.py parses and transforms logs
         ↓
      5. datadog_scrubber.py removes sensitive data
         ↓
      6. datadog_batcher.py groups into optimal batches
         ↓
      7. datadog_client.py sends to Datadog API
         ↓
      8. Response returned to Lambda
      ```
      
      ### Event Type Handlers
      
      **CloudWatch Logs:**
      - Decompresses gzip'd log data
      - Parses JSON log format
      - Extracts log group and stream metadata
      - Adds AWS-specific tags
      
      **S3 Logs:**
      - Downloads log files from S3
      - Detects file format (CloudTrail, VPC Flow, ALB, etc.)
      - Parses format-specific structure
      - Handles large files with streaming
      
      **SNS/Kinesis:**
      - Unwraps message envelope
      - Extracts nested CloudWatch logs
      - Processes each record independently
      
      ### Key Features
      
      **Tagging:**
      - Automatic AWS tags: region, account_id, function_name
      - Custom tags from DD_TAGS environment variable
      - Source-specific tags (log group, S3 bucket, etc.)
      
      **Error Handling:**
      - Retries with exponential backoff
      - Partial failure support (continues on individual log errors)
      - Error logging to CloudWatch
      - Optional failed event storage (DD_STORE_FAILED_EVENTS)
      
      **Performance Optimizations:**
      - Parallel processing of S3 objects
      - In-memory batching
      - Gzip compression
      - Connection pooling
      
      ### Testing Structure
      
      Located in `aws/logs_monitoring/tests/`:
      
      - `test_lambda_function.py` - Handler routing tests
      - `test_logs.py` - Core logging functionality
      - `test_parsing.py` - Log format parsing
      - `test_transformation.py` - Data transformation
      - `test_awslogs_handler.py` - CloudWatch specific
      - `test_s3_handler.py` - S3 specific
      - `test_caching.py` - Metadata caching
      
      ### Configuration via Environment Variables
      
      - `DD_API_KEY` - Datadog API key (or from Secrets Manager)
      - `DD_SITE` - Datadog site (datadoghq.com, etc.)
      - `DD_TAGS` - Custom tags to add
      - `DD_MULTILINE_LOG_REGEX_PATTERN` - Pattern for multiline logs
      - `DD_SOURCE` - Override log source
      - `DD_CUSTOM_SCRUBBING_RULE` - Additional scrubbing patterns
      - `DD_STORE_FAILED_EVENTS` - Store failed events in S3
      
      ### Special Features
      
      **Trace Forwarder:**
      The `trace_forwarder/` subdirectory is a Go-based implementation for forwarding APM traces. It's a separate component with its own build process (Makefile, Dockerfile).
      
      **Caching:**
      Implements tag caching with configurable TTL (TAGS_CACHE_TTL_SECONDS) to reduce API calls for metadata.
      
      **Lambda Extension Support:**
      While the Forwarder can forward Lambda metrics/traces, Datadog now recommends the Lambda Extension for direct telemetry collection.
      
      Would you like me to dive deeper into any specific component or explain how to modify the code for custom use cases?
  
  - prompt: "I'm getting throttling errors on my forwarder"
    response: |
      Throttling errors on the Datadog Forwarder are usually caused by insufficient concurrency or high invocation rates. Let me help you diagnose and fix this.
      
      ## Diagnosis Steps
      
      ### Step 1: Check Current Metrics
      
      ```bash
      # Check throttles in CloudWatch
      aws cloudwatch get-metric-statistics \
        --namespace AWS/Lambda \
        --metric-name Throttles \
        --dimensions Name=FunctionName,Value=DatadogForwarder \
        --start-time $(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%S) \
        --end-time $(date -u +%Y-%m-%dT%H:%M:%S) \
        --period 300 \
        --statistics Sum \
        --region us-east-1
      
      # Check concurrent executions
      aws cloudwatch get-metric-statistics \
        --namespace AWS/Lambda \
        --metric-name ConcurrentExecutions \
        --dimensions Name=FunctionName,Value=DatadogForwarder \
        --start-time $(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%S) \
        --end-time $(date -u +%Y-%m-%dT%H:%M:%S) \
        --period 300 \
        --statistics Maximum \
        --region us-east-1
      ```
      
      ### Step 2: Check Function Configuration
      
      ```bash
      aws lambda get-function-configuration \
        --function-name DatadogForwarder \
        --region us-east-1 \
        --query '{ReservedConcurrency: ReservedConcurrentExecutions, Timeout: Timeout, MemorySize: MemorySize}'
      ```
      
      ## Common Causes and Solutions
      
      ### Issue 1: No Reserved Concurrency Set
      
      **Problem:** The Forwarder is competing with other Lambda functions for account concurrency.
      
      **Solution:** Set reserved concurrency
      
      ```bash
      # Set to at least 10, adjust based on your log volume
      aws lambda put-function-concurrency \
        --function-name DatadogForwarder \
        --reserved-concurrent-executions 10 \
        --region us-east-1
      ```
      
      Or update via CloudFormation - modify your stack:
      ```yaml
      Parameters:
        ReservedConcurrency: "10"  # Change from empty to 10+
      ```
      
      **Recommendation:** Start with 10, increase to 20-50 for high-volume environments.
      
      ### Issue 2: Account Concurrency Limit Reached
      
      **Problem:** Your AWS account has hit the regional Lambda concurrency limit (default 1000).
      
      **Check current limits:**
      ```bash
      aws service-quotas get-service-quota \
        --service-code lambda \
        --quota-code L-B99A9384 \
        --region us-east-1
      ```
      
      **Solution:** Request a limit increase through AWS Support or reduce usage elsewhere.
      
      ### Issue 3: Too Many Triggers
      
      **Problem:** Excessive CloudWatch Log subscriptions or S3 events causing burst invocations.
      
      **Check number of triggers:**
      ```bash
      # List CloudWatch subscriptions
      aws logs describe-subscription-filters \
        --log-group-name "/aws/lambda/DatadogForwarder" \
        --region us-east-1
      
      # Count total subscriptions pointing to Forwarder
      for group in $(aws logs describe-log-groups --query 'logGroups[*].logGroupName' --output text); do
        aws logs describe-subscription-filters --log-group-name "$group" --region us-east-1
      done | grep DatadogForwarder | wc -l
      ```
      
      **Solutions:**
      - Consolidate log groups if possible
      - Use sampling/filtering at the subscription filter level
      - Consider using Kinesis as an intermediary for high-volume sources
      
      ### Issue 4: Function Duration Too Long
      
      **Problem:** Long execution times reduce effective concurrency.
      
      **Check average duration:**
      ```bash
      aws cloudwatch get-metric-statistics \
        --namespace AWS/Lambda \
        --metric-name Duration \
        --dimensions Name=FunctionName,Value=DatadogForwarder \
        --start-time $(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%S) \
